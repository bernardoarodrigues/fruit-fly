[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fruitfly-sim"
version = "0.1.0"
description = "Connectome-constrained embodied Drosophila research simulator"
requires-python = ">=3.12,<3.15"
dependencies = [
  "flygym @ git+https://github.com/NeLy-EPFL/flygym.git@38c8ec61034cd59bc5ba0de20688d4a3c0000d60",
  "mujoco==3.9.0", "numpy==2.5.2", "scipy>=1.17,<2",
  "numba>=0.66,<0.68", "pyarrow>=25,<26", "pandas>=3,<4", "pillow>=12,<13",
]

[project.optional-dependencies]
test = ["pytest>=9,<10", "brian2==2.10.1", "joblib>=1.5,<2"]
morphology = ["nibabel>=5.4,<6", "scikit-image>=0.26,<0.27"]

[project.scripts]
fruitfly-data = "fruitfly.data:main"
fruitfly-view = "fruitfly.viewer:main"

[tool.setuptools.packages.find]
include = ["fruitfly*"]

[tool.setuptools.package-data]
fruitfly = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
